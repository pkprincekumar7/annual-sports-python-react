# Production config for https://sports.learning-dev.com (used via docker-compose.prod.yml).
# The upstreams and location blocks mirror nginx.conf: keep them in sync when nginx.conf changes.
upstream identity_service {
    server identity-service:8001;
}

upstream enrollment_service {
    server enrollment-service:8002;
}

upstream department_service {
    server department-service:8003;
}

upstream sports_participation_service {
    server sports-participation-service:8004;
}

upstream event_configuration_service {
    server event-configuration-service:8005;
}

upstream scheduling_service {
    server scheduling-service:8006;
}

upstream scoring_service {
    server scoring-service:8007;
}

upstream reporting_service {
    server reporting-service:8008;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name sports.learning-dev.com;

    # Let's Encrypt HTTP-01 challenge (used by certbot renew --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sports.learning-dev.com;

    ssl_certificate     /etc/letsencrypt/live/sports.learning-dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sports.learning-dev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /identities {
        proxy_pass http://identity_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /identities/ {
        proxy_pass http://identity_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /enrollments {
        proxy_pass http://enrollment_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /enrollments/ {
        proxy_pass http://enrollment_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /departments {
        proxy_pass http://department_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /departments/ {
        proxy_pass http://department_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sports-participations {
        proxy_pass http://sports_participation_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /sports-participations/ {
        proxy_pass http://sports_participation_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /event-configurations {
        proxy_pass http://event_configuration_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /event-configurations/ {
        proxy_pass http://event_configuration_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
